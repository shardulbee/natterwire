name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: natterwire-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'shardulbee/natterwire' && github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, natterwire-turbogadget]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tui/go.sum
      - name: Test
        run: |
          bash -n scripts/build-app
          go -C api test -race ./...
          go -C api vet ./...
          go -C tui test -race ./...
          go -C tui vet ./...
      # Personal Apple Development identity only; no distribution or notarization.
      - name: Build and sign
        env:
          P12: ${{ secrets.NATTERWIRE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.NATTERWIRE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          keychain="$work/signing.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$work"' EXIT
          cat > "$work/state.swift" <<'SWIFT'
          import Foundation
          import Security
          import CryptoKit
          func check(_ status: OSStatus, _ operation: String) throws {
              guard status == errSecSuccess else { throw NSError(domain: operation, code: Int(status)) }
          }
          func report(_ keychain: SecKeychain, _ label: String) throws {
              var flags = SecKeychainStatus()
              try check(SecKeychainGetStatus(keychain, &flags), "\(label) status")
              var path = [CChar](repeating: 0, count: 4096)
              var length = UInt32(path.count)
              try check(SecKeychainGetPath(keychain, &length, &path), "\(label) path")
              print("\(label): path=\(String(cString: path)) flags=\(flags)")
          }
          func run() throws {
              try check(SecKeychainSetUserInteractionAllowed(false), "Disable interaction in this process")
              var keychain: SecKeychain?
              try check(SecKeychainOpen(CommandLine.arguments[1], &keychain), "Open requested keychain")
              try report(keychain!, "requested keychain")
              let query: [CFString: Any] = [kSecClass: kSecClassIdentity, kSecMatchSearchList: [keychain!],
                                          kSecMatchLimit: kSecMatchLimitAll, kSecReturnRef: true]
              var result: CFTypeRef?
              try check(SecItemCopyMatching(query as CFDictionary, &result), "Constrained identity lookup")
              var matches = 0
              for identity in result as! [SecIdentity] {
                  var certificate: SecCertificate?
                  try check(SecIdentityCopyCertificate(identity, &certificate), "Read certificate")
                  let fingerprint = Insecure.SHA1.hash(data: SecCertificateCopyData(certificate!) as Data)
                      .map { String(format: "%02X", $0) }.joined()
                  guard fingerprint == CommandLine.arguments[2].uppercased() else { continue }
                  matches += 1
                  print("certificate SHA1=\(fingerprint)")
                  var certificateKeychain: SecKeychain?
                  try check(SecKeychainItemCopyKeychain(unsafeBitCast(certificate!, to: SecKeychainItem.self), &certificateKeychain), "Certificate backing keychain")
                  try report(certificateKeychain!, "certificate keychain")
                  var key: SecKey?
                  try check(SecIdentityCopyPrivateKey(identity, &key), "Copy private-key reference")
                  var keyKeychain: SecKeychain?
                  try check(SecKeychainItemCopyKeychain(unsafeBitCast(key!, to: SecKeychainItem.self), &keyKeychain), "Private-key backing keychain")
                  try report(keyKeychain!, "private-key keychain")
              }
              guard matches == 1 else { throw NSError(domain: "Expected one matching identity; found \(matches)", code: Int(errSecItemNotFound)) }
          }
          do { try run() } catch let error as NSError {
              print("\(error.domain): OSStatus=\(error.code)")
              exit(1)
          }
          SWIFT
          swiftc "$work/state.swift" -o "$work/state"
          password=$(openssl rand -hex 32)
          printf '%s' "$P12" | base64 --decode > "$work/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Explicit signing scope leaves the user's search/default keychains intact.
          identity=5748468843D7D2316B51EF650D85B1ED8A1E7196
          security show-keychain-info "$keychain"
          security find-identity -v -p codesigning "$keychain"
          "$work/state" "$keychain" "$identity"
          export SIGNING_STATE="$work/state" SIGNING_KEYCHAIN="$keychain" SIGNING_IDENTITY="$identity"
          codesign() {
            if [[ " $* " != *' --sign '* ]]; then /usr/bin/codesign "$@"; return; fi
            printf 'codesign argument: <%q>\n' "$@"
            "$SIGNING_STATE" "$SIGNING_KEYCHAIN" "$SIGNING_IDENTITY"
            if /usr/bin/codesign "$@"; then return; else result=$?; fi
            # Controlled comparison, restoring the exact list even on failure.
            (
              original=()
              listing=$(security list-keychains -d user)
              while read -r path; do original+=("${path//\"/}"); done <<< "$listing"
              trap 'security list-keychains -d user -s "${original[@]}"' EXIT
              security list-keychains -d user -s "$SIGNING_KEYCHAIN" "${original[@]}"
              "$SIGNING_STATE" "$SIGNING_KEYCHAIN" "$SIGNING_IDENTITY"
              if /usr/bin/codesign "$@"; then echo 'Temporary search-list prepend retry succeeded'; fi
            )
            return "$result"
          }
          export -f codesign
          mkdir -p "$RUNNER_TEMP/natterwire"
          scripts/build-app --output "$RUNNER_TEMP/natterwire/Natterwire.app" --sign "$identity" --keychain "$keychain"
          CGO_ENABLED=0 go -C tui build -trimpath -o "$RUNNER_TEMP/natterwire/natterwire-tui" .
          codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none "$RUNNER_TEMP/natterwire/natterwire-tui"
      - name: Install signed app on TurboGadget
        if: false # Diagnostic run must not install, even if signing unexpectedly succeeds.
        run: |
          set -euo pipefail
          [[ $(uname -s) == Darwin && $(id -un) == shardul ]]
          work="$RUNNER_TEMP/natterwire"
          app="$HOME/Applications/Natterwire.app"
          incoming="$work/Natterwire.app"
          backup="$HOME/Applications/Natterwire.app.previous"
          requirement='=anchor apple generic and certificate leaf = H"5748468843D7D2316B51EF650D85B1ED8A1E7196"'
          [[ ! -e "$backup" && ! -L "$backup" ]] || {
            echo "Inspect retained backup before retrying: $backup" >&2; exit 1;
          }
          for signed in "$app" "$incoming" "$work/natterwire-tui"; do
            [[ ! -L "$signed" ]]
            codesign --verify --deep --strict -R "$requirement" "$signed"
          done
          [[ $(plutil -extract CFBundleIdentifier raw -o - "$incoming/Contents/Info.plist") == com.shardul.natterwire.api ]]
          [[ $(plutil -extract CFBundleExecutable raw -o - "$incoming/Contents/Info.plist") == natterwire-api ]]
          for binary in "$incoming/Contents/MacOS/natterwire-api" "$work/natterwire-tui"; do
            go version -m "$binary" | grep -Fq "vcs.revision=$GITHUB_SHA"
            "$binary" --help >/dev/null
          done
          # AppKit cancels Quit while the delegate stops its loop for Go cleanup.
          /usr/bin/osascript <<'APPLESCRIPT'
          try
            if application id "com.shardul.natterwire.api" is running then tell application id "com.shardul.natterwire.api" to quit
          on error errorMessage number errorNumber
            if errorNumber is not -128 then error errorMessage number errorNumber
          end try
          APPLESCRIPT
          for _ in {1..30}; do
            pgrep -x natterwire-api >/dev/null || break
            sleep 1
          done
          if pgrep -x natterwire-api >/dev/null; then
            echo 'Natterwire did not quit; leaving installation untouched' >&2; exit 1
          fi
          mv "$app" "$backup"
          mv "$incoming" "$app"
          /usr/bin/open "$app"
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 \
            --max-time 5 --output /dev/null http://127.0.0.1:8741/send-session
          # Retain the old bundle on failure until the replacement is healthy.
          mv -f "$work/natterwire-tui" "$HOME/.local/bin/natterwire-tui"
          rm -rf "$backup"
          echo "Installed natterwire $GITHUB_SHA; relaunch existing TUI processes."
